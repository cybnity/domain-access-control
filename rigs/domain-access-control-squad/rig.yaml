version: "0.2"
name: domain-access-control-squad
culture_file: CULTURE.md
summary: >
  Software factory team of agents (named Rig) dedicated to cybnity/domain-access-control (CYBNITY's Access
  Control domain), from OpenRig's built-in factory team: a lead and a PM
  advisor, build, QA and design, plus two independent reviewers. The team may
  push its own branches and open pull requests; only Olivier merges.

docs:
  - path: README.md

# Claude Code seats get OpenRig's instruction blocks in CLAUDE.local.md, so
# they stay out of the repository's own CLAUDE.md. Codex seats use AGENTS.md.
managed_blocks:
  claude-code: CLAUDE.local.md

# Olivier's posture for this fleet: Claude Code seats launch in auto mode.
permission_policy: builtin:auto

pods:
  - id: orch
    label: Orchestration
    members:
      - id: lead
        agent_ref: "local:agents/orchestration/orchestrator"
        runtime: codex
        model: gpt-6-luna
        profile: default
        cwd: "~/github_repo/domain-access-control"
        startup:
          files:
            - path: guidance/lead-first-move.md
              delivery_hint: send_text
              required: true
      - id: advisor
        agent_ref: "local:agents/product-management/pm"
        runtime: claude-code
        model: claude-opus-5-5
        profile: advisor
        cwd: "~/github_repo/domain-access-control"
        startup:
          files:
            - path: guidance/advisor-role.md
              delivery_hint: send_text
              required: true
    edges:
      - kind: collaborates_with
        from: advisor
        to: lead

  - id: dev
    label: Development
    members:
      - id: build
        agent_ref: "local:agents/development/implementer"
        runtime: claude-code
        model: claude-opus-5-5
        profile: default
        cwd: "~/github_repo/domain-access-control"
      - id: qa
        agent_ref: "local:agents/development/qa"
        runtime: claude-code
        model: claude-sonnet-5-5
        profile: default
        cwd: "~/github_repo/domain-access-control"
      - id: design
        agent_ref: "local:agents/design/product-designer"
        runtime: claude-code
        model: claude-opus-5-5
        profile: default
        cwd: "~/github_repo/domain-access-control"
    edges:
      - kind: delegates_to
        from: build
        to: qa

  - id: review
    label: Review
    members:
      - id: reviewer1
        agent_ref: "local:agents/review/independent-reviewer"
        runtime: claude-code
        model: claude-opus-5-5
        profile: default
        cwd: "~/github_repo/domain-access-control"
      - id: reviewer2
        agent_ref: "local:agents/review/independent-reviewer"
        runtime: codex
        model: gpt-6-luna
        profile: default
        cwd: "~/github_repo/domain-access-control"
    edges: []

edges:
  - kind: delegates_to
    from: orch.lead
    to: dev.build
  - kind: delegates_to
    from: orch.lead
    to: dev.design
  - kind: delegates_to
    from: orch.lead
    to: review.reviewer1
  - kind: delegates_to
    from: orch.lead
    to: dev.qa
  - kind: delegates_to
    from: orch.lead
    to: review.reviewer2
  - kind: can_observe
    from: review.reviewer1
    to: dev.build
  - kind: can_observe
    from: review.reviewer1
    to: dev.design
  - kind: can_observe
    from: review.reviewer2
    to: dev.build
  - kind: can_observe
    from: review.reviewer2
    to: dev.qa
